 phfp_nationalism.1.t: "Philippine Enlightenment"
 phfp_nationalism.1.d: "A generation of ilustrados — sons of the principalia sent abroad for education — has returned home fluent in liberal philosophy and increasingly unwilling to accept the friars' word as law. Their newspapers speak of reform, assimilation, and representation in the Cortes. For now, at least, they still speak of reform."
 phfp_nationalism.1.f: ""
 phfp_nationalism.1.a: "Let them write. Reform is cheaper than rebellion"
 phfp_nationalism.1.b: "Watch them closely. Reformists have a way of becoming revolutionaries"

 phfp_nationalism.2.t: "Reformist Victory"
 phfp_nationalism.2.d: "Against expectation, the reformist project has borne fruit. Assimilation, representation, or at least tolerable autonomy now seems within reach — and with it, a quieter, more durable peace than any bolo could offer"
 phfp_nationalism.2.f: "History will record no uprising here — only petitions granted just late enough to matter, and a people who chose the slower road to dignity"
 phfp_nationalism.2.a: "A triumph of reform, comes autonomy"
 phfp_nationalism.2.b: "We are spanish, thus, we remain spanish."

 phfp_nationalism.3.t: "Cry of Pugad Lawin"
 phfp_nationalism.3.d: "In the hills above [ROOT.GetCountry.GetCapital.GetName], the cry goes up — not for reform, not for representation, but for the archipelago itself. There is no petition left to write"
 phfp_nationalism.3.f: "'Ang hindi magmahal sa sariling wika, mahigit pa sa hayop at malansang isda.' The pen is put down. The bolo is picked up."
 phfp_nationalism.3.a: "So be it. It is war."

 phfp_je_the_revolution: "The Philippine Revolution"
 phfp_je_the_revolution_reason: "The pen has failed where the sword may yet succeed. What began as petitions and pamphlets in Madrid salons has curdled into secret societies and buried krises, waiting for the signal."

 phfp_nationalism.4.t: "Beloved Country"
 phfp_nationalism.4.d: "The struggle is won. The archipelago answers to no crown but its own, within its own hills and river deltas"
 phfp_nationalism.4.f: "'Land of the morning, child of the sun returning...' The anthem is new. The pride is not."
 phfp_nationalism.4.a: "Mabuhay ang bayang Pilipinas!"

 phfp_nationalism.5.t: "Triumphant [SCOPE.sCountry('overlord_scope').GetNameNoFlag]"
 phfp_nationalism.5.d: "The uprising is crushed. [SCOPE.sCountry('overlord_scope').GetNameNoFlag] tightens its grip, and the leaders of the revolt are made examples of, one way or another."
 phfp_nationalism.5.f: "The dream of Independence is not dead, buried perhaps, within unmarked graves and the memories of those who survived to tell the tale."
 phfp_nationalism.5.a: "We fight on, in whatever form remains to us"
