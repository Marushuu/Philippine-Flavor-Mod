l_english:
 phfp_je_propagandist_movement: "The Propaganda Movement"
 phfp_je_propagandist_movement_reason: "A new class of educated, well-traveled Filipinos has emerged, The Ilustrados.\nThey wonder, with growing impatience, why the same liberties are denied them at home.\nThus, they come with demands."

 phfp_propaganda_movement_bar: "Revolutionary Fervor"
 phfp_propaganda_movement_bar_desc: "#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/400)"

 phfp_je_propagandist_movement_complete_header: "#title Will solidify #b Colonial Rule#! if:#!\n"
 phfp_je_propagandist_movement_fail_header: "#title Will trigger the #b Philippine Revolution#! if:#!\n"

 the_reformists_wins_tt: "$phfp_propaganda_movement_bar$ has been at #variable 100#! or less for #variable 100#! months"
 the_revolution_brews_tt: "$phfp_propaganda_movement_bar$ has reached #variable 400#! or we declare independence."

 phfp_declare_independence_button: "Declare Independence"
 phfp_declare_independence_button_desc: "We are ready as we are now, pick up your arms and fight."

 progress_from_radicals_tt: "[Concept('concept_state', '$concept_states$')] in [concept_turmoil] in the #bold [ROOT.GetCountry.GetName]#!"
 progress_from_loyalists_tt: "[Concept('concept_state', '$concept_states$')] with [Concept('concept_loyalist','$concept_loyalists$')] in the #bold [ROOT.GetCountry.GetName]#!"
