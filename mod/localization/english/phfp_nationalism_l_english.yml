l_english:
 phfp_je_propagandist_movement: "The Propaganda Movement"
 phfp_je_propagandist_movement_reason: "A new class of educated, well-traveled Filipinos has emerged, The Ilustrados. They wonder, with growing impatience, why the same liberties are denied them at home."

 phfp_je_propagandist_movement_complete_header: "#title Will solidify #b Colonial Rule#! if:#!\n"
 phfp_je_propagandist_movement_fail_header: "#title Will lead to an Independent #b Philippines#! if:#!\n"

 phfp_declare_independence_button: "Declare Independence"
 phfp_declare_independence_button_desc: "We are ready as we are now, pick up your arms and fight."

 phfp_nationalism.1.t: "Philippine Enlightenment"
 phfp_nationalism.1.d: "A generation of Ilustrados, sons of the Principalia sent abroad for education, has returned home fluent in liberal philosophy and increasingly unwilling to accept the friars' word as law."
 phfp_nationalism.1.f: "$philippines.5.f$"
 phfp_nationalism.1.a: "Let them write. Reform is cheaper than rebellion"
 phfp_nationalism.1.b: "Watch them closely. Reformists have a way of becoming revolutionaries"

 phfp_nationalism.2.t: "Reformist Victory"
 phfp_nationalism.2.d: "Against expectation, the reformist project has borne fruit.\nAssimilation, representation, or at least tolerable autonomy now seems within reach."
 phfp_nationalism.2.f: "History will record no uprising here — only petitions granted just late enough to matter, and a people who chose the slower road to dignity"
 phfp_nationalism.2.a: "A triumph of reform, comes autonomy"
 phfp_nationalism.2.b: "We will remain Spanish alongside autonomy."
 phfp_nationalism.2.c: "We shall unite with Spain."

 phfp_nationalism.3.t: "Cry of Pugad Lawin"
 phfp_nationalism.3.d: "In the hills above [ROOT.GetCountry.GetCapital.GetName], the cry goes up for reform, not for representation, but for the archipelago itself.\nThere is no petition left to write"
 phfp_nationalism.3.f: ""He who knows not to love his own language, is worse than beasts and putrid fish."\n\n—José Rizal"
 phfp_nationalism.3.a: "We will grab independence through steel and blood."
 phfp_nationalism.3.b: "We will maintain the reformist path."

 phfp_nationalism.4.t: "$phfp_nationalism.3.t$"
 phfp_nationalism.4.d: "$phfp_nationalism.3.d$"
 phfp_nationalism.4.f: "$phfp_nationalism.3.f$"
 phfp_nationalism.4.a: "$phfp_nationalism.3.a$"

 phfp_je_the_revolution: "The Philippine Revolution"
 phfp_je_the_revolution_reason: "The pen has failed where the sword may yet succeed. What began as petitions and pamphlets in Madrid salons has curdled into secret societies and buried krises, waiting for the signal."

 phfp_nationalism.5.t: "Beloved Country"
 phfp_nationalism.5.d: "Finally, the archipelago answers to no crown but its own, within its own hills and river deltas."
 phfp_nationalism.5.f: "'Land of the morning, child of the sun returning...' The anthem is new. The pride is not."
 phfp_nationalism.5.a: "Mabuhay ang bayang Pilipinas!"

 phfp_nationalism.6.t: "Whispers of the Katipunan"
 phfp_nationalism.6.d: "Beneath the reformist societies, something harder has begun to grow. In back rooms and cockpits, men are signing their names in their own blood and swearing oaths the friars will never read.\nA warehouse clerk named [SCOPE.sCharacter('bonifacio_scope').GetFullName] is said to move between the lodges more often than anyone else. The pen has had its turn. Some now believe only the bolo will finish the argument."
 phfp_nationalism.6.f: "A pact is not a petition. It does not ask."
 phfp_nationalism.6.a: "Let them plot. The signal has not yet been given"

 phfp_nationalism.7.t: "La Solidaridad"
 phfp_nationalism.7.d: "In Barcelona, [SCOPE.sCharacter('lopez_scope').GetFullName] has founded a fortnightly paper, its columns filled with essays on representation, taxation, and the dignity denied the colony's native sons. Before long [SCOPE.sCharacter('del_pilar_scope').GetFullName] has crossed from Manila to take up its editorship in Madrid.\nCopies are already finding their way back to the islands, folded small and passed hand to hand."
 phfp_nationalism.7.f: "A newspaper cannot storm a garrison. But it can, given time, hollow out the ground beneath one."
 phfp_nationalism.7.a: "Let Madrid hear them out"
 phfp_nationalism.7.b: "Quietly starve the paper of patrons"

 phfp_nationalism.8.t: "The Friars Read the Mail"
 phfp_nationalism.8.d: "Parish curates have taken to intercepting correspondence and combing through cargo manifests, on the theory that heresy travels best in the false bottom of a trunk. Most of what they find is harmless. Some of it is not."
 phfp_nationalism.8.f: "Censorship is a tax on curiosity, and the ilustrados have never been short on either patience or curiosity."
 phfp_nationalism.8.a: "Confiscate what the friars find"
 phfp_nationalism.8.b: "Let the letters through unread"

 phfp_nationalism.9.t: "Noli Me Tángere"
 phfp_nationalism.9.d: "[SCOPE.sCharacter('rizal_scope').GetFullName], a young physician lately returned from his studies in Europe, has published a novel skewering the friar orders, the civil guard, and the complacency of the colony's own elite in equal measure.\nHis book is banned within weeks. It is also, by then, unstoppable — copied by hand where it cannot be bought, and read aloud in the dark where it cannot be owned."
 phfp_nationalism.9.f: "A censored book sells itself twice: once for the story, and once for the crime of reading it."
 phfp_nationalism.9.a: "Ban it, and let the friars enforce the ban"
 phfp_nationalism.9.b: "Let it circulate. Better to know what is being said than to guess"

 phfp_nationalism.10.t: "La Liga Filipina"
 phfp_nationalism.10.d: "[SCOPE.sCharacter('rizal_scope').GetFullName] has founded a civic league, modest in its stated aims, uniting reform-minded principales, clerks, and merchants behind mutual aid, education, and the slow, patient work of representation.\nIt asks for nothing the friars have not already been asked for a hundred times. That has never stopped them from refusing before."
 phfp_nationalism.10.f: "Unity is the one demand a colonial government cannot grant without also granting everything else."
 phfp_nationalism.10.a: "Recognize the league. Let reform have its forum"
 phfp_nationalism.10.b: "Dissolve it before it becomes something worse"


 FERVOR_OF_FILIPINO_CULTURE_ACTIVISM: "Average [concept_fervor] ([GetPlayer.MakeScope.ScriptValue('average_german_fervor')|v0]) of [GetCulture('tagalog').GetName], [GetCulture('ilocano').GetName], [GetCulture('visayan').GetName], [GetCulture('moro').GetName], [GetCulture('lumad').GetName], and [GetCulture('filipino_mestizo').GetName] [Concept('concept_culture','$concept_cultures$')]"
