 phfp_je_frailocracy: "La Frailocracia"
 phfp_je_frailocracy_reason: "Centuries of colonial rule have left the religious orders holding more land, more schools, and more sway over the common #italic tao#! than the Governor-General himself.\nThe friar-curate is often the only representative of Spain a barrio ever sees — confessor, teacher, landlord, and censor in one cassock.\nReform this arrangement, and the Church may never forgive it. Leave it untouched, and neither will the ilustrados"

