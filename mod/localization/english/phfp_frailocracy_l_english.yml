l_english:
 phfp_je_frailocracy: "La Frailocracia"
 phfp_je_frailocracy_reason: "Centuries of colonial rule have left the religious orders holding more land, more schools, and more sway over the common #italic tao#! than the Governor-General himself.\nThe friar-curate is often the only representative of Spain a barrio ever sees — confessor, teacher, landlord, and censor in one cassock.\nReform this arrangement, and the Church may never forgive it. Leave it untouched, and neither will the ilustrados"

 phfp_frailocracy.1.t: "The Cassock Loosens Its Grip"
 phfp_frailocracy.1.d: "Chair by chair, the friar orders have been eased out of the schoolroom, the ministry, and the town hall. The Frailocracia remains a fixture of the parish, but no longer of the state.\nWhere a friar once countersigned every decision of consequence, a secular clerk now does the signing."
 phfp_frailocracy.1.f: "The cassock does not vanish. It simply stops being the only garment in the room."
 phfp_frailocracy.1.a: "Let the reform stand"

 phfp_frailocracy.2.t: "The Friar Curate's Tithe"
 phfp_frailocracy.2.d: "The parish priest of a rice-growing barrio has raised the tithe again, and reminded his inquilinos, not for the first time, that the land they work belongs to the order and not to them.\nA delegation of tenant farmers has walked three days to lay the matter before the provincial governor."
 phfp_frailocracy.2.f: "The friar collects rent as confessor, landlord, and magistrate all at once — there is no appeal that does not pass through his own hands."
 phfp_frailocracy.2.a: "The curate sets his own terms. It is not our place to interfere"
 phfp_frailocracy.2.b: "Cap the tithe by decree, whatever the order thinks of it"

 phfp_frailocracy.3.t: "Survey of the Friar Estates"
 phfp_frailocracy.3.d: "A junior official, more diligent than tactful, has completed a survey of the religious orders' agricultural holdings and finds them larger, and their tenants poorer, than anyone in [ROOT.GetCountry.GetCapital.GetName] cared to admit."
 phfp_frailocracy.3.f: "Friar estates: acquired by pious donation, held by pious litigation, and defended, when it comes to that, by pious excommunication."
 phfp_frailocracy.3.a: "File the report, and let the friars keep what is theirs"
 phfp_frailocracy.3.b: "Redistribute the estates to the tenants who work them"

 phfp_frailocracy.4.t: "Friars in the Classroom"
 phfp_frailocracy.4.d: "A handful of ilustrado-aligned teachers have begun slipping arithmetic and civics past the catechism in the parish schools, over the quiet objection of the friar-supervisors who still hold the keys to every schoolhouse in the province."
 phfp_frailocracy.4.f: "Rome teaches that faith and reason need not quarrel. The friar-supervisors have their own opinion on the matter."
 phfp_frailocracy.4.a: "The catechism comes before the primer. Enforce the curriculum"
 phfp_frailocracy.4.b: "Let the ilustrados teach quietly, so long as no one asks too loudly"

 phfp_frailocracy.5.t: "The Confessional and the Ballot"
 phfp_frailocracy.5.d: "Several parish priests have taken to naming, from the pulpit, which local candidates a good Catholic ought to favor. It is, strictly speaking, no one's business what a confessor tells his own flock. It is also, strictly speaking, an election."
 phfp_frailocracy.5.f: "The friar does not need to hold office. He only needs to decide who does."
 phfp_frailocracy.5.a: "The parish priest knows his flock better than any governor does"
 phfp_frailocracy.5.b: "Keep the pulpit out of the polling place"

 phfp_frailocracy.6.t: "An Inquilino's Complaint"
 phfp_frailocracy.6.d: "A tenant farmer has walked into the provincial office with a torn ledger and a grievance against the friar estate's overseer.\nFalse measures at harvest time, and a debt that never seems to shrink no matter how much is paid against it.\nHis case is unremarkable. That is precisely the problem."
 phfp_frailocracy.6.f: "One ledger, honestly kept, would answer the question. The estate has never kept one."
 phfp_frailocracy.6.a: "Side with the overseer. The order's accounts are not ours to question"
 phfp_frailocracy.6.b: "Side with the tenant, and open the ledger"

 phfp_frailocracy.7.t: "Hermano Pule's Confraternity"
 phfp_frailocracy.7.d: "[SCOPE.sCharacter('hermano_pule_scope').GetFullName], a devout layman, sought admission to the priesthood and was turned away.\nThe religious orders do not ordain natives, whatever their piety;\nThus, he founded his own: the Cofradía de San José, a brotherhood of prayer and mutual aid open to precisely the men the friars would not have.\nIt has grown faster than anyone in the parish houses is comfortable with, and the friars are calling it something between heresy and sedition."
 phfp_frailocracy.7.f: "A church that will not ordain you is, eventually, a church you build yourself."
 phfp_frailocracy.7.a: "#Italic This is a heretic, do not imitate.#!"
 phfp_frailocracy.7.b: "Grant the confraternity recognition, whatever the bishop says"

 phfp_frailocracy.8.t: "Blood at Bagumbayan"
 phfp_frailocracy.8.d: "In the aftermath of a mutiny at the Cavite arsenal, three native priests — [SCOPE.sCharacter('gomez_scope').GetFullName], [SCOPE.sCharacter('burgos_scope').GetFullName], and [SCOPE.sCharacter('zamora_scope').GetFullName] — are tried on flimsy evidence and garroted before a crowd at the Luneta.\nTheir crime, in the eyes of the friar orders, was less the mutiny than the years they had spent arguing that a native-born priest was no less a priest than a Spanish one.\nThe execution is meant to end the argument. In the barrios and seminaries, it does the opposite."
 phfp_frailocracy.8.f: "GOMBURZA\n\nThree syllables the friars hoped no one would remember, and no Filipino ever forgot."
 phfp_frailocracy.8.a: "The court's verdict stands. Let it be the end of the matter"
 phfp_frailocracy.8.b: "Decry the executions as martyrdom, whatever Manila thinks of it"

