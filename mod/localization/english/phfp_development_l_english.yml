l_english:
 phfp_je_development: "Fostering Economic Development"
 phfp_je_development_reason: "This archipelago posses abundant natural resources, whether agricultural or industrial, yet the profits only continue to flow towards foreign shores. Thus, we must develop our own, extract our resources and refine it ourselves. Create our own businesses, our own banks, and our own trade relationships all for the benefit of our citizens.\n\nWe must harness our wealth for the benefit of all our citizens"

 phfp_je_development_ip4: "$je_philippines_development$"
 phfp_je_development_ip4_reason: "$je_philippines_development_reason$"

 phfp_development.1.t: "The Opening of the Gates of Manila"
 phfp_development.1.d: "In 1834, through [SCOPE.sCountry('spain_scope').GetAdjectiveNoFlag] Royal Decree, the Port of Manila was finally opened to Foreign Trade.\nNo longer will we be bound to only trade with [SCOPE.sCountry('spain_scope').GetNameNoFlag]'s Galleons. What awaits us?"
 phfp_development.1.f: "For two and a half centuries, Manila has served as the western terminus of the Manila-Acapulco Galleon Trade, with only Spanish ships allowed to dock at its ports. However, the Royal Decree of September 1834 has shattered this monopoly, finally opening Manila's ports to foreign traders.\n\nThe Age of the Galleons has ended, and a new beginning awaits the Pearl of the Orient Seas."
 phfp_development.1.a: "It is an era of change"

 phfp_development.2.t: "The Factories Open"
 phfp_development.2.d: "Foreign capital and native enterprise alike have found fertile ground in the archipelago's opened ports.\nWorkshops, warehouses, and the first true factories now dot [ROOT.GetCountry.GetCapital.GetName] and its surrounding provinces."
 phfp_development.2.f: "A decade ago, we were only meant for raw resources such as sugar, abaca, and little else. With industrialization, that is beginning to change."
 phfp_development.2.a: "Onwards"

 phfp_development.3.t: "The Archipelago Awakens"
 phfp_development.3.d: "Development has taken hold across the islands, though its character remains ours to decide. Do we chase the smokestacks of the city, or the plantations of the countryside?"
 phfp_development.3.f: "Every peso invested is a peso that could have gone elsewhere. The choice of where reveals what kind of nation is being built."
 phfp_development.3.a: "The future is urban and industrial"
 phfp_development.3.b: "The future is rooted in the land"

 phfp_je_luzon_development: "Developing the Heartlands"
 phfp_je_luzon_development_reason: ""
 luzon_development_manila_port_tt: "We have constructed the $phfp_state_trait_port_of_manila$"
 luzon_development_manila_rail_tt: "We have constructed the Manila Railway"
 phfp_manila_port_button: "Expand the Harbor"
 phfp_manila_port_button_desc: "Dredge deeper channels and expand the piers of Manila Bay to accommodate the steamships now crowding its waters."
 phfp_manila_rail_button: "Build Railways"
 phfp_manila_rail_button_desc: "Lay iron rails across the Central Luzon Plain, binding the capital to the rice fields and sugar estates of the interior."

 phfp_je_visayas_development: "Developing the Visayan Islands"
 phfp_je_visayas_development_reason: ""
 visayas_development_port_tt: "We have constructed either the $phfp_state_trait_port_of_cebu$ or the $state_trait_port_of_iloilo$"
 visayas_development_port_cebu_tt: "If we built the Port of Cebu:"
 visayas_development_port_iloilo_tt: "If we built the Port of Iloilo:"
 phfp_cebu_port_button: "Prioritize Cebu's Harbor"
 phfp_cebu_port_button_desc: "Invest in Cebu's harbor and workshops, betting the Visayas' future on the workshop rather than the fields."
 phfp_iloilo_port_button: "Prioritize Iloilo's Harbor"
 phfp_iloilo_port_button_desc: "Invest in Iloilo's sugar wealth and port capacity, betting the Visayas' future on the fields rather than the workshop."

 phfp_development.4.t: "The Harbor Widens"
 phfp_development.4.d: "[SCOPE.sState('luzon_scope').GetCityHubName]'s port facilities, straining under the weight of new trade, are dredged, expanded, and modernized to accommodate the steamships now calling at the Pearl of the Orient."
 phfp_development.4.f: "Manila Bay has welcomed galleons, and now steamers. It will, in time, welcome whatever comes after those as well"
 phfp_development.4.a: "A harbor worthy of being called the Pearl of the Orient"

 phfp_development.5.t: "Rails Across the Plains"
 phfp_development.5.d: "Iron rails now cross the Central Luzon Plain, binding [SCOPE.sState('luzon_scope').GetCityHubName] to the rice fields and sugar estates of the interior far faster than any cart road ever could."
 phfp_development.5.f: "Our lands, once disconnected, are starting to be pieced together."
 phfp_development.5.a: "Full steam ahead!"

 phfp_development.6.t: "The Heartland Transformed"
 phfp_development.6.d: "[Scope.sState('luzon_scope').GetName]'s development has reached a turning point. Its future character — a forge of industry or a breadbasket of agriculture — must now be decided in earnest."
 phfp_development.6.f: "Both roads lead to prosperity. Only one leads to smokestacks over the Pasig River."
 phfp_development.6.a: "Hearts of Iron"
 phfp_development.6.b: "Hearts of Earth"

 phfp_development.7.t: "Focus on Cebu"
 phfp_development.7.d: "Cebu's harbor and workshops have grown enough to rival Iloilo's position. Shall the 'Queen City of the South' title be contested after all?""
 phfp_development.7.f: "Cebu's urbanism and manufacturing has grown enough to even rival that of the sugar barons of [Scope.sState('visayas_scope').GetName]."
 phfp_development.7.a: "Cebu is the true Queen City of the South"
 phfp_development.7.b: "I change my mind."

 phfp_development.8.t: "Focus on Iloilo"
 phfp_development.8.d: "Iloilo's sugar wealth and port traffic have grown to rival Cebu's own ambitions. Shall the Queen City of the South be built up as the [Scope.sState('visayas_scope').GetName]'s anchor?"
 phfp_development.8.f: "Iloilo's sugar barons have quietly funded half the province's infrastructure themselves. They would like that noted"
 phfp_development.8.a: "Iloilo is the true Queen City of the South"
 phfp_development.8.b: "I change my mind."

 phfp_development.9.t: "The Jewel Islands"
 phfp_development.9.d: "Between Cebu's workshops and Iloilo's sugar wealth, the Visayas have carved out a prosperity distinctly their own."
 phfp_development.9.f: "The Visayas have never much cared for playing second city"
 phfp_development.9.a: "Iloilo's sugar has proven the wiser investment"
 phfp_development.9.b: "Cebu's workshops have proven the wiser investment"

 phfp_development.10.t: "The Miracle of the Orient Seas"
 phfp_development.10.d: "Luzon industrializes, the Visayas prosper, and even Mindanao's frontier has been tamed. The archipelago stands transformed from a colonial backwater into something the world is beginning to call a miracle.
 phfp_development.10.f: "'The Pearl of the Orient,' one visiting journalist writes, 'shines ever brighter within the Pacific.'"
 phfp_development.10.a: "A miracle centuries in the making"
