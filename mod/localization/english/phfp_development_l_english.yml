l_english:
 phfp_je_development: "Fostering Economic Development"
 phfp_je_development_reason: "This archipelago posses abundant natural resources, whether agricultural or industrial, yet the profits only continue to flow towards foreign shores. Thus, we must develop our own, extract our resources and refine it ourselves. Create our own businesses, our own banks, and our own trade relationships all for the benefit of our citizens.\n\nWe must harness our wealth for the benefit of all our citizens"

 phfp_je_development_ip4: "$je_philippines_development$"
 phfp_je_development_ip4_reason: "$je_philippines_development_reason$"

 phfp_development.1.t: "The Opening of the Gates of Manila"
 phfp_development.1.d: "In 1834, through [SCOPE.sCountry('spain_scope').GetAdjectiveNoFlag] Royal Decree, the Port of Manila was finally opened to Foreign Trade.\n\nNo longer will we be bound to only trade with [SCOPE.sCountry('spain_scope').GetNameNoFlag]'s Galleons. What awaits us?"
 phfp_development.1.f: "For two and a half centuries, Manila has served as the western terminus of the Manila-Acapulco Galleon Trade, with only Spanish ships allowed to dock at its ports. However, the Royal Decree of September 1834 has shattered this monopoly, finally opening Manila's ports to foreign traders.\n\nThe Age of the Galleons has ended, and a new beginning awaits the Pearl of the Orient Seas."
 phfp_development.1.a: "It is an era of change"

