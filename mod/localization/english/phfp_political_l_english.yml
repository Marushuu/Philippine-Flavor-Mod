l_english:
  # Replaced JEs
  phfp_je_group_hidden: "Hidden DLC Content"

  # Laws
  law_frailocracy: "Frailocracy"
  law_frailocracy_desc: "Agricultural land are dominated by the various catholic religious orders. Their tenants, the inquilinos, were often subjected to arbitrary rent increases."

  # Amendments
  phfp_amendment_philippine_sangleys: "Sangley Presence"
  phfp_amendment_philippine_sangleys_desc: "The Philippines have a long history of chinese migration, throughout it's history, the economic vitality of these islands has become inextricably linked to the Sangley and their descendants, the Mestizo de Sangleys."
  phfp_amendment_economic_miracle: "Miracle on the Orient"
  phfp_amendment_economic_miracle_desc: "Our Economic Miracle has led to a surge in investor confidence. So long as the state remains on its current course, it will have capital to spare"

  # Decisions
  phfp_sabah_flag_decision: "Implement the Ninth Ray Sabah Flag"
  phfp_sabah_flag_decision_desc: "Flag proposed by Emmanuel Osorio, the ninth ray can represent multiple things such as a Ninth Province but the 4th star would represent Sabah."

  phfp_remove_sabah_flag_decision: "Remove Ninth Ray Sabah Flag"
  phfp_remove_sabah_flag_decision_desc: "I prefer the old flag."

  # Dynamic Subjugation Names
  phfp_dyn_c_spanish: "Captaincy General of the Philippines"
  phfp_dyn_c_dominion: "Philippine Dominion"
  phfp_dyn_c_american: "Philippine Insular Government"
  phfp_dyn_c_commonwealth: "Commonwealth of the Philippines"
  phfp_dyn_c_japanese: "Philippine Executive Commission"

  # Dynamic Independent Philippine Names
  phfp_dyn_c_communist: "People's Republic of the Philippines"
  phfp_dyn_c_anarchist: "Philippine Anarchist Confederation"
  phfp_dyn_c_empire: "Philippine Empire"
  phfp_dyn_c_theocracy: "Holy Marian Islands"

  # Power Bloc Names

  # Party Names
  phfp_py_agrarian: "Collectivista" # Collectivista Party, a Nacionalista Faction
  phfp_py_anarchist: "Association of the Free Filipinos" # Fictional
  phfp_py_communist: "Hukbong Bayan" # Hukbong Bayan/New People's Army
  phfp_py_conservative: "Nacionalista" # Oldest Party
  phfp_py_fascist: "KALIBAPI" # Kapisanan sa Paglilingkod sa Bagong Pilipinas
  phfp_py_free_trade: "Progresista" # Progresista Party
  phfp_py_liberal: "La Liga Filipina" # While the Liberal Party exists, this is more flavorful
  phfp_py_military: "Katipunan" # Referring to the Katipunan
  phfp_py_radicals: "People's Power" # Lakas ng Bayan (LABAN) from the People Power Revolution
  phfp_py_religious: "Kapatiran" # Modern Christian Democracy Party, means 'Brotherhood'
  phfp_py_social_democrats: "PDSP" # Partido Demokratiko Sosyalista ng Pilipinas

  # Interest Groups
  phfp_ig_principalia: "Principalia" # Landowners
  phfp_ig_principalia_desc: "The native and mestizo landed gentry of the Philippines, who mediate between the colonial administration, the friar estates, and the peasantry beneath them."
  phfp_ig_frailocracia: "Frailocracia" # Devout - Spain
  phfp_ig_frailocracia_desc: "The religious orders in their capacity as the archipelago's largest landholders, educators, and power brokers. The Church acts not only as faith, but also the landlord."
  phfp_ig_sakahan: "Sakahan" # Rural Folk
  phfp_ig_sakahan_desc: "The tenant farmers and peasant cultivators of the Philippines, working land they do not own under terms they did not set."
  phfp_ig_hukbo: "Sandatahang Lakas" # Independent Armed Forces
  phfp_ig_hukbo_desc: "The armed forces of the republic, forged from the veterans of the revolution against Spain. Their loyalty to the new state runs deeper than any oath of commission."

  # Ideologies - Movements
  phfp_ideology_independence_movement: "$phfp_ideology_katipunero_leader$"
  phfp_ideology_independence_movement_desc: "#lore This movement opposes oppressive measures imposed upon their nation by colonial authorities, and seeks to advance policies that serve the ends of national self-governance.#!"

  phfp_ideology_ilustrado: "$ideology_ilustrado$"
  phfp_ideology_ilustrado_desc: "$ideology_ilustrado_desc$"

  phfp_ideology_ilustrado_leader: "$ideology_ilustrado_leader$"
  phfp_ideology_ilustrado_leader_desc: "$ideology_ilustrado_leader_desc$"

  phfp_ideology_katipunero_leader: "Katipunero"
  phfp_ideology_katipunero_leader_desc: "This leader opposes oppressive measures imposed upon their nation by colonial authorities, preferring policies that serve the ends of national self-governance"

  phfp_ideology_frailocrat: "Frailocrat"
  phfp_ideology_frailocrat_desc: "#lore $phfp_ig_frailocracia_desc$ #!"

  phfp_movement_filipino_national: "Philippine National Movement"
  phfp_movement_filipino_national_name: "$phfp_movement_filipino_national$"
